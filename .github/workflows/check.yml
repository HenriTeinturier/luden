name: Vérifications

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', 'docs/screenshots/**']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', 'docs/screenshots/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DATABASE_URL: postgresql://luden:ci-placeholder@127.0.0.1:5434/luden?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate

  installation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://luden:ci-placeholder@127.0.0.1:5434/luden?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release
